databases:
  - name: smartex-db
    databaseName: smartex
    user: smartex
    plan: free

services:
  - type: web
    name: smartex-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartex-db
          property: connectionString
    autoDeploy: true
